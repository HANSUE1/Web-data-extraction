<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seine Studio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23121110'/><path d='M6 10q10 8 20 0M6 16q10 8 20 0M6 22q10 8 20 0' stroke='%23c8f560' stroke-width='2.4' fill='none' stroke-linecap='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><!-- never holds up the page: offline, the fallback fonts show at once -->
  <link rel="stylesheet" href="/static/studio.css">
  <script>
    try { const t = localStorage.getItem("seine.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <aside class="rail" aria-label="Main">
    <a class="brand" href="#/" aria-label="Seine Studio home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path class="wave w1" d="M5 10q11 8 22 0"/><path class="wave w2" d="M5 16q11 8 22 0"/><path class="wave w3" d="M5 22q11 8 22 0"/></svg>
      <span>Seine</span>
    </a>
    <nav class="nav" id="nav">
      <span class="nav-glow" id="navGlow" aria-hidden="true"></span>
      <a href="#/" data-view="overview"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zm10 7h6V11h-6zM4 20h6v-4H4zm10-11h6V4h-6z"/></svg><span>Overview</span></a>
      <a href="#/extract" data-view="extract"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg><span>Extract</span></a>
      <a href="#/live" data-view="live"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8M8.5 8.5a4.9 4.9 0 0 0 0 7m7-7a4.9 4.9 0 0 1 0 7"/></svg><span>Live</span><i class="badge" id="liveBadge" hidden></i></a>
      <a href="#/library" data-view="library"><svg viewBox="0 0 24 24"><path d="M4 5h5v15H4zm6 0h4v15h-4zm5.5.6 4.3-1 3.3 14.6-4.3 1z"/></svg><span>Library</span></a>
    </nav>
    <div class="rail-foot">
      <button class="icon-btn" id="themeBtn" title="Switch theme (T)" aria-label="Switch theme">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="icon-btn" id="paletteBtn" title="Command palette (Ctrl+K)" aria-label="Open command palette">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
    </div>
  </aside>

  <main class="stage" id="stage">
    <header class="topbar">
      <div class="crumbs" id="crumbs"></div>
      <button class="search-trigger" id="searchTrigger">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Jump to anything…</span><kbd>Ctrl K</kbd>
      </button>
      <a class="live-pill" id="livePill" href="#/live" hidden><i></i><span>Crawling</span></a>
    </header>
    <div class="view" id="view"></div>
  </main>

  <div class="palette" id="palette" hidden>
    <div class="palette-box" role="dialog" aria-modal="true" aria-label="Command palette">
      <input id="paletteInput" aria-label="Search commands, sites and runs" placeholder="Type a command, a site, or a run…" autocomplete="off">
      <ul id="paletteList" role="listbox"></ul>
      <footer><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></footer>
    </div>
  </div>

  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
    <div class="drawer-panel">
      <header><h3 id="drawerTitle">Record</h3><button class="icon-btn" id="drawerClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
      <div class="drawer-body" id="drawerBody"></div>
    </div>
  </aside>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
